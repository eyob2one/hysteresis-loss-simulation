<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAG-HYST Labs - Hysteresis Loss Simulation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/mag-hyst.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="mobile-header">
    <div>
      <h1>MAG - <span>HYSTERSIS LABS</span></h1>
      <p>Magnetic core analytics</p>
    </div>
    <div class="mobile-actions">
      <button class="icon-button theme-toggle" id="theme-toggle-mobile" type="button" aria-label="Toggle theme" title="Toggle theme">
        <i data-lucide="sun"></i>
      </button>
      <div class="status-pill" id="api-status-mobile">
        <span class="status-dot pending"></span>
        <span>LOCAL</span>
      </div>
    </div>
  </div>

  <div class="mobile-tabs" aria-label="Mobile workspace navigation">
    <button class="mobile-tab active" data-view="simulator">Simulator</button>
    <button class="mobile-tab" data-view="data">Data</button>
    <button class="mobile-tab" data-view="ml">ML Fit</button>
    <button class="mobile-tab" data-view="theory">Theory</button>
    <button class="mobile-tab" data-view="script">Script</button>
  </div>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-block">
        <div>
          <h1>MAG<span> HYSTERSIS</span></h1>
         <p>Magnetic core analytics</p>
        </div>
        <button class="icon-button theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme">
          <i data-lucide="sun"></i>
        </button>
      </div>

      <nav class="side-nav" aria-label="Workspace navigation">
         <button class="nav-button" data-view="theory" type="button">
          <i data-lucide="book-open-text"></i>
          <span>
            <strong>Theory Panel</strong>
          </span>
        </button>
        <button class="nav-button active" data-view="simulator" type="button">
          <i data-lucide="sliders-horizontal"></i>
          <span>
            <strong>B-H Loop Simulator</strong>
          </span>
        </button>
       
        <button class="nav-button" data-view="data" type="button">
          <i data-lucide="database"></i>
          <span>
            <strong>Data Import</strong>
          </span>
        </button>
        <button class="nav-button" data-view="ml" type="button">
          <i data-lucide="brain-circuit"></i>
          <span>
            <strong>Steinmetz ML Fit</strong>
          </span>
        </button>
        
        <button class="nav-button" data-view="script" type="button">
          <i data-lucide="terminal-square"></i>
          <span>
            <strong>Python Bridge</strong>
          </span>
        </button>
      </nav>

    </aside>

    <section class="workspace">
      <header class="workspace-header">
        <div>
          <span class="eyebrow">Workspace View</span>
          <h2 id="view-title">Simulation & Parameter Config</h2>
          <p id="view-subtitle">Friend-style B-H loop model with AC playback and domain vectors.</p>
        </div>
      </header>

      <main class="workspace-main">
        <section class="view" id="view-theory" data-src="views/theory.html"></section>
        <section class="view active" id="view-simulator" data-src="views/simulator.html"></section>
        <section class="view" id="view-data" data-src="views/data.html"></section>
        <section class="view" id="view-ml" data-src="views/ml.html"></section>
        <section class="view" id="view-script" data-src="views/script.html"></section>
      </main>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./js/mag-hyst.js"></script>
</body>
</html>
